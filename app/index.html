<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0c335f" />
    <script>
      // Set the theme before first paint so there is no flash: saved choice, else OS.
      ;(function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#061629' : '#0c335f'
      })()
    </script>
    <meta
      name="description"
      content="Attune Health is the behavioral health EHR that fits how your program runs. Build it yourself with the AI tools you already use, or let our team run it for you."
    />
    <meta property="og:title" content="Attune Health" />
    <meta
      property="og:description"
      content="Attuned to your operations, and to you. Behavioral health software you can build on, or let us run."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://behavioralweb.bluestep.net/spa/brand/social-share.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Attune Health</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
